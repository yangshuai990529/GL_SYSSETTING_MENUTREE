services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menutree}
      POSTGRES_USER: ${POSTGRES_USER:-menutree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menutree}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-menutree}:${POSTGRES_PASSWORD:-menutree}@db:5432/${POSTGRES_DB:-menutree}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  postgres_data:
